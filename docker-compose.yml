services:
  carjam:
    build: .
    image: carjam:latest
    container_name: carjam
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - JUKEBOX_HOST_PASSWORD=${JUKEBOX_HOST_PASSWORD:-}
    env_file:
      - .env
